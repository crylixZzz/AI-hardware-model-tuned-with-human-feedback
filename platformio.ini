; Unified build/flash/test across the primary board (ESP32) and the fallback (RP2040),
; each with a matching emulation env that compiles the identical generated source.
; The Python layer selects an env by name: hardware = board id, emulation = "<id>_emu".
;
; HARDWARE-TODO: point `test_filter` at the task under measurement so the harness in
; tasks/<id>/harness_{hw,emu}/ is built with GENERATED_SRC set to the program under
; test. This mapping is driven per-run by the orchestration (see RUNBOOK); there is no
; single static value because the task varies.

[platformio]
default_envs = esp32

[env]
test_framework = unity
build_flags = -std=gnu++17

[env:esp32]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -DBOARD_ESP32

[env:esp32_emu]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
; Runs under the Espressif QEMU fork; functional plus limited timing.
build_flags = ${env.build_flags} -DBOARD_ESP32 -DEMULATION

[env:rp2040]
platform = raspberrypi@1.12.0
board = pico
framework = arduino
build_flags = ${env.build_flags} -DBOARD_RP2040

[env:rp2040_emu]
platform = raspberrypi@1.12.0
board = pico
framework = arduino
build_flags = ${env.build_flags} -DBOARD_RP2040 -DEMULATION
